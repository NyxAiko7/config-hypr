# Вставь в hyprland.conf (или подключи через source = ...)

# Лаунчер и меню сеанса
bind = SUPER, SPACE,  exec, quickshell ipc call launcher toggle
bind = SUPER, ESCAPE, exec, quickshell ipc call session toggle

# Яркость с OSD (громкость показывается сама при любом изменении)
bind = , XF86MonBrightnessUp,   exec, brightnessctl set 5%+ && quickshell ipc call osd brightness
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%- && quickshell ipc call osd brightness

# Громкость (OSD появится автоматически)
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl  = , XF86AudioMute,        exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Автозапуск
exec-once = quickshell
exec-once = swaync

# Размытие под панелями (синтаксис для старых версий Hyprland;
# в новых: layerrule = blur on, match:namespace qs-bar)
layerrule = blur, qs-bar
layerrule = blur, qs-launcher
layerrule = blur, qs-session
layerrule = blur, qs-osd
layerrule = ignorealpha 0.3, qs-bar
