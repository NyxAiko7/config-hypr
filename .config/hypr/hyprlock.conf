general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(25, 23, 36, 0.8)
}

label {
    monitor =
    text = Hello, $USER
    color = rgb(235, 188, 186)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$TIME"
    color = rgb(224, 222, 244)
    font_size = 90
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    color = rgb(144, 140, 170)
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(49, 44, 69, 0.6)
    inner_color = rgba(31, 29, 46, 0.8)
    font_color = rgb(224, 222, 244)
    check_color = rgb(246, 193, 119)
    fail_color = rgb(254, 106, 106)

    fade_on_empty = true
    fade_timeout = 1000
    placeholder_text = <span foreground="#908caa"><i>Password...</i></span>
    hide_input = false

    position = 0, -60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:10000] echo "🔋 $(cat /sys/class/power_supply/BAT*/capacity 2>/dev/null || echo '100')%"
    color = rgb(144, 140, 170)
    font_size = 12
    font_family = JetBrainsMono Nerd Font
    position = 0, -130
    halign = center
    valign = center
}